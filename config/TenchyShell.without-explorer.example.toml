# Perfil para una VM o usuario secundario sin explorer.exe.
# No modifica Winlogon y requiere iniciar con --without-explorer.

[benchmark]
enabled = true
capture_profile = "detailed"
sample_interval_seconds = 10
retention_days = 14
max_storage_mb = 256

# Requiere instalar y autorizar el bridge MSIX opcional de notificaciones.
[notifications]
enabled = true

[terminal]
command = "wezterm-gui.exe"
file_manager_arguments = "start --always-new-process --"
command_shell = "powershell.exe"
command_arguments = "start --always-new-process -- {shell} -NoExit -Command"

[file_manager]
command = "yazi.exe"

[launcher]
enabled = true
command = ""

[applications]
browser = "msedge.exe"

[status_panel]
enabled = true
hotkey = "Ctrl+Alt+S"
width = 220
height = 96
edge_zone = 4
monitor = "primary"

[system_tray]
# TenchyShell no depende de Explorer para esta función.
# La bandeja propia se habilitará cuando esté implementada.
enabled = true
hotkey = "Ctrl+Alt+T"
width = 420
height = 280

[input_language]
# No depende de la barra de idioma ni de explorer.exe.
enabled = true
title = "Idioma"
label_format = "short"
hotkey = ""

[layout]
# Habilita el layout de ventanas. El preset 1x2 significa 1 fila y 2 columnas.
enabled = true
max_zones = 9
default_preset = "1x2"
# Tamaño de los números del overlay como porcentaje del lado menor del monitor.
# 4.0 produce una etiqueta grande y proporcional en distintas resoluciones.
zone_number_size_percent = 4.0

# Las coordenadas son relativas al área de trabajo y van de 0.0 a 1.0.
# monitor = "*" aplica a todos los monitores sin layout específico.
# También puedes usar monitor = "primary" o un identificador exacto como
# monitor = '\\.\DISPLAY2' para definir un layout por monitor.
[[layout.zones]]
monitor = "*"
number = 1
left = 0.0
top = 0.0
right = 0.25
bottom = 0.5

[[layout.zones]]
monitor = "*"
number = 2
left = 0.0
top = 0.5
right = 0.25
bottom = 1.0

[[layout.zones]]
monitor = "*"
number = 3
left = 0.25
top = 0.0
right = 0.75
bottom = 1.0

[[layout.zones]]
monitor = "*"
number = 4
left = 0.75
top = 0.0
right = 1.0
bottom = 0.5

[[layout.zones]]
monitor = "*"
number = 5
left = 0.75
top = 0.5
right = 1.0
bottom = 1.0

[hotkeys]
# Win+Enter permanece reservado por Windows incluso sin Explorer.
terminal = "Win+T"
files = "Win+F"
launcher = "Alt+Space"
browser = "Win+B"
close_window = "Win+Q"
recovery = "Ctrl+Alt+Shift+E"

[hotkeys.workspaces]
switch_1 = "Win+1"
switch_2 = "Win+2"
switch_3 = "Win+3"
switch_4 = "Win+4"
switch_5 = "Win+5"
switch_6 = "Win+6"
switch_7 = "Win+7"
switch_8 = "Win+8"
switch_9 = "Win+9"
move_1 = "Win+Shift+1"
move_2 = "Win+Shift+2"
move_3 = "Win+Shift+3"
move_4 = "Win+Shift+4"
move_5 = "Win+Shift+5"
move_6 = "Win+Shift+6"
move_7 = "Win+Shift+7"
move_8 = "Win+Shift+8"
move_9 = "Win+Shift+9"

[hotkeys.window]
move_left = "Ctrl+Win+Left"
move_right = "Ctrl+Win+Right"
move_up = "Ctrl+Win+Up"
move_down = "Ctrl+Win+Down"
resize_grow = "Ctrl+Alt+Shift+Right"
resize_shrink = "Ctrl+Alt+Shift+Left"
maximize = "Ctrl+Alt+M"
restore = "Ctrl+Alt+R"
focus = "Ctrl+Alt+F"

[hotkeys.layout]
# Cada hotkey coloca la ventana activa en la zona con el mismo número.
zone_1 = "Ctrl+Win+1"
zone_2 = "Ctrl+Win+2"
zone_3 = "Ctrl+Win+3"
zone_4 = "Ctrl+Win+4"
zone_5 = "Ctrl+Win+5"
zone_6 = "Ctrl+Win+6"
zone_7 = "Ctrl+Win+7"
zone_8 = "Ctrl+Win+8"
zone_9 = "Ctrl+Win+9"
# Modificadores usados durante el arrastre para mostrar el overlay.
drag_modifier = "Ctrl+Win"
