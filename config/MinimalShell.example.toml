# Configuración de ejemplo para MinimalShell.
# Modifica los valores y reinicia MinimalShell para aplicarlos.

[terminal]
command = "wezterm-gui.exe"
file_manager_arguments = "start --always-new-process --"
command_shell = "powershell.exe"
command_arguments = "start --always-new-process -- {shell} -NoExit -Command"

[file_manager]
command = "yazi.exe"

[launcher]
enabled = true
command = ""

[applications]
browser = "brave.exe"

[hotkeys]
terminal = "Ctrl+Alt+Enter"
files = "Ctrl+Alt+E"
launcher = "Ctrl+Alt+Space"
browser = "Ctrl+Alt+B"
close_window = "Ctrl+Alt+Q"
recovery = "Ctrl+Alt+Shift+E"
